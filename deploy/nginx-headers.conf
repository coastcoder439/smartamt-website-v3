# Sicherheits-Header von SmartAmt für nginx.
#
# Gleiche Werte wie in ../vercel.json (geprüft von scripts/gates/header-gleich.mjs).
# Einbinden mit `include /pfad/zu/nginx-headers.conf;` in den server-Block UND in jeden
# location-Block, der eigene add_header-Zeilen hat: nginx erbt add_header nur, wenn der
# Block selbst keine eigenen add_header-Zeilen enthält.
#
# Die Seite liegt als statischer Export in `out/` (npm run build). Beispiel:
#
#   server {
#       listen 443 ssl;
#       server_name www.smartamt.de;
#       root /var/www/smartamt/out;
#       include /etc/nginx/snippets/smartamt-headers.conf;
#       location / { try_files $uri $uri/ =404; }
#       error_page 404 /404.html;
#   }

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://backend.tobiassteffen.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'" always;
